[workspace]
resolver = "3"
members = [
	"crates/domain",
    "crates/ui",
    "crates/report-generator",
	"apps/backoffice",
  "apps/client-ui", 
  "services/api",
]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "warn"

[workspace.package]
edition = "2024"

[workspace.dependencies]
aws-sdk-s3 = { version = "=1.154.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
dioxus = "0.7.10"
dioxus-cli = "0.7.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
config = "0.15.25"
dotenvy = "0.15.7"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
tokio = "1.53.1"
web-time = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }
chrono = { version = "0.4.45" , features = ["serde"] }
