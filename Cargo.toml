[workspace]
resolver = "3"
members = [
	"apps/backoffice",
  "apps/client-ui", 
	"crates/models",
  "services/api",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
dioxus = { version = "0.7.10", features = ["fullstack"] }
dioxus-cli = "0.7.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
config = "0.15.25"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }
chrono = { version = "0.4.45" , features = ["serde"] }
