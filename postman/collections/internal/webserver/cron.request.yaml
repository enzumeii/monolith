$kind: http-request
url: "{{server}}/_cron"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{vault:cron_secret}}"
order: 2100
description: >-
  Invoke awaited checkout recovery, scheduled reports and refresh-token retention.
  server must be the deployment root for this request (no /api or /v1 prefix);
  vault:cron_secret must match the private CRON_SECRET. Select
  scheduler.implementation=vercel in the API TOML overlay; VPS returns 404.
  Checkout recovery runs first when checkout is configured and
  checkout_recovery.enabled=true, independently of scheduler.enabled. It uses
  bounded batches, renewable fenced leases and the original payment identity;
  it never creates a fresh payment key or blindly repeats uncertain Shopify
  completion. A persisted business retry/manual outcome is not an HTTP failure.
  Reports run while work time remains, then reserved auth retention is attempted
  even after a lane fails. Success is 204 with no body and Cache-Control: no-store.
  401 rejects authentication; 503 includes missing cron secret or checkout
  claim/lease/persistence/deadline failure. Existing report and retention errors
  keep their mappings. No provider or database error body contains private
  credentials. The checked-in Vercel Hobby trigger remains daily; frequent
  recovery requires an owner-configured authenticated external trigger.
  Requests may advance real orders: run only against the intended environment.
scripts:
  - type: afterResponse
    code: ""
    language: text/javascript
