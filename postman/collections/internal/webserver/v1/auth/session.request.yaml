$kind: http-request
description: |-
  Read current access-token identity without rotating refresh credentials. Requires existing server and vault:access_token variables from login; inherited bearer authentication takes precedence over cookies. For browser-cookie testing, select noauth and use the login cookie jar; GET requires no Origin or body. No credentials are returned or stored by this request.
  Success 200: {"admin_id":42,"username":"example-admin","role":"ADMIN","expires_at":4102444800}. Response has Cache-Control: no-store and no Set-Cookie.
  Missing, malformed, expired or invalid credentials: 401 {"error":"Invalid or expired token"} with WWW-Authenticate: Bearer. Invalid x-session-mode: 400 {"error":"Invalid session mode"}. A 401 permits the existing single-use refresh request, followed by another session read.
url: "{{server}}/v1/auth/session"
method: GET
auth:
  type: inherit
  credentials:
    id: d5d9db9c-ad63-479d-af2c-22b521036d9d
scripts:
  - type: afterResponse
    code: |-
      pm.test("Session reads never change credentials", function () {
        pm.expect(pm.response.headers.get("Cache-Control")).to.equal("no-store");
        pm.expect(pm.response.headers.has("Set-Cookie")).to.be.false;
        const result = pm.response.json();
        pm.expect(result).not.to.have.property("access_token");
        pm.expect(result).not.to.have.property("refresh_token");
        if (pm.response.code === 200) {
          pm.expect(result).to.have.all.keys("admin_id", "username", "role", "expires_at");
          pm.expect(result.admin_id).to.be.a("number");
          pm.expect(result.username).to.be.a("string");
          pm.expect(result.role).to.be.oneOf(["ADMIN", "SUPER_ADMIN"]);
          pm.expect(result.expires_at).to.be.a("number");
        } else if (pm.response.code === 401) {
          pm.expect(result).to.deep.equal({error: "Invalid or expired token"});
          pm.expect(pm.response.headers.get("WWW-Authenticate")).to.equal("Bearer");
        } else if (pm.response.code === 400) {
          pm.expect(result).to.deep.equal({error: "Invalid session mode"});
        } else {
          pm.expect.fail("Unexpected session response status");
        }
      });
    language: text/javascript
order: 1500
