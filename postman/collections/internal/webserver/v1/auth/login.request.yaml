$kind: http-request
description: Set login_username and login_password as local Postman variables. Keep credentials out of shared or committed files.
url: "{{server}}/v1/auth/login"
method: POST
body:
  type: json
  content: |-
    {
        "username": "{{vault:login_username}}",
        "password": "{{vault:login_password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      // 1. Parse the JSON response body
      const responseData = pm.response.json();
      // 2. Set the environment variable
      pm.vault.set("access_token", responseData.access_token);
      pm.vault.set("refresh_token", responseData.refresh_token);
    language: text/javascript
order: 1000
