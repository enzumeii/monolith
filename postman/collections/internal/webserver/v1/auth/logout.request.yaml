$kind: http-request
url: "{{server}}/v1/auth/logout"
method: POST
body:
  type: json
  content: |-
    {
        "refresh_token" : "{{vault:refresh_token}}"
    }
auth:
  type: inherit
  credentials:
    id: d5d9db9c-ad63-479d-af2c-22b521036d9d
scripts:
  - type: afterResponse
    code: |-
      // 2. Set the vault variable
      pm.vault.set("access_token", "");
      pm.vault.set("refresh_token", "");
    language: text/javascript
order: 3000
