$kind: http-request
description: "Public current-logo bytes. Use convention_id and convention_logo_asset_id from the upload response URL. 200 image/png or image/jpeg, nosniff, no-store; 400 invalid IDs/query/body; 404 absent/wrong/superseded asset; 503 unavailable S3; 502 invalid stored data/S3 failure; 504 timeout; 500 database failure. Storage keys are derived by the API; report objects are never exposed."
url: "{{server}}/v1/conventions/{{convention_id}}/logo/{{convention_logo_asset_id}}"
method: GET
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Current image returned", () => { pm.response.to.have.status(200); pm.response.to.have.header("X-Content-Type-Options", "nosniff"); });
    language: text/javascript
