$kind: http-request
description: Download the exact stored CSV/XLSX bytes without calling report providers. file must name a file on the audit; omit file to download the first file. Returns 409 when files are not ready, 400 for an unknown file, 404 for a missing audit, or 500 for unavailable/corrupt storage.
url: "{{server}}/v1/admin/report-results/:id/download?file={{report_file_name}}"
method: GET
queryParams:
  file: "{{report_file_name}}"
pathVariables:
  - key: id
    value: "{{report_result_id}}"
    description: UUID returned by report history.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Stored file downloads securely", () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get("Cache-Control")).to.eql("no-store");
        pm.expect(pm.response.headers.get("Content-Disposition")).to.include("attachment;");
        pm.expect(pm.response.headers.get("Content-Type")).to.match(/text\/csv|spreadsheetml/);
      });
    language: text/javascript
order: 10000
