$kind: http-request
description: "Upload raw PNG/JPEG (1..2097152 bytes, up to4096x4096). Select the synthetic postman/fixtures/convention-logo.png file, or replace with an owned image. Inherits admin bearer credentials. Browser cookies additionally require the configured Origin and x-session-mode:cookie. 200 returns complete saved convention with durable API-relative logo_url; 400 invalid type/image/IDs/query; 413 oversized; 404 missing; 503 S3 unavailable; 502 S3 rejection; 504 timeout; 500 database failure. Failed upload preserves the prior database URL."
url: "{{server}}/v1/admin/conventions/{{convention_id}}/logo"
method: PUT
order: 8000
headers:
  Content-Type: image/png
body:
  type: file
  content:
    src: postman/fixtures/convention-logo.png
scripts:
  - type: afterResponse
    code: |-
      pm.test("Logo saved", () => { pm.response.to.have.status(200); pm.expect(pm.response.json().logo_url).to.match(/^\/api\/v1\/conventions\//); });
      pm.collectionVariables.set("convention_logo_url", pm.response.json().logo_url);
      pm.collectionVariables.set("convention_logo_asset_id", pm.response.json().logo_url.split("/").pop());
    language: text/javascript
