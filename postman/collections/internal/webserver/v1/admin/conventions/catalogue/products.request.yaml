$kind: http-request
description: "Browse Shopify products for variant selection. Required location_id is a Location GID (replace the synthetic 123); optional search is raw Shopify query syntax grouped with mandatory status:active AND tracks_inventory:true. Only active products and tracked-inventory variants are returned; products without tracked variants are omitted. Root page metadata is preserved even when filtering empties a page. page_size defaults 25 (1..250); cursor/search must be nonblank and at most 2048 UTF-8 bytes. Set catalogue_cursor to prior page_info.end_cursor. Returns product description/images without a redundant status field and variant selected_options, exact price amount/currency, tracked/inventory_policy, available_quantity, eligible and unavailable_reason. Active available=0 stays 0; missing/inactive levels give null. CONTINUE variants remain visible as ineligible. No supplier cost. Invalid query 400, auth 401, location absent 404, unusable upstream 502, unavailable client 503, timeout 504. Inherits bearer access_token. Incomplete nested variants fail the whole page with generic upstream 502; no partial products are returned. Other unusable upstream responses retain 502 {\"error\":\"Upstream request failed\"}."
url: "{{server}}/v1/admin/conventions/catalogue?location_id=gid://shopify/Location/123&page_size=25&search=collection_id:123 AND title:head*"
method: GET
queryParams:
  location_id: "gid://shopify/Location/123"
  page_size: "25"
  search: "collection_id:123 AND title:head*"
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      if (body.page_info?.has_next_page && body.page_info.end_cursor) {
        pm.collectionVariables.set("catalogue_cursor", body.page_info.end_cursor);
      }
    language: text/javascript
order: 1000
