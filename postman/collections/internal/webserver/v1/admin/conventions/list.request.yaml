$kind: http-request
description: "Admin/Super Admin bearer authentication inherited. Invalid input 400, missing convention 404, duplicate/state conflict 409, database failure 500. List all enabled and disabled conventions with stable created_at/id ordering. Optional preorder_enabled=true/false is strict. Returns 200 {items,page,per_page,has_next}. Safe error examples: 400 {\"error\":\"Invalid convention request body\"}; 404 {\"error\":\"Convention not found\"}; 500 {\"error\":\"Internal server error\"}."
url: "{{server}}/v1/admin/conventions?page=1&per_page=25"
method: GET
queryParams:
  page: "1"
  per_page: "25"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.eql(200));
    language: text/javascript
order: 1000
