$kind: http-request
description: 'Logo requests attach logo_url from upload; omit for no change, null to clear. Responses contain stable logo_url plus short-lived signed logo_preview_url and logo_preview_url_expires_at; never persist or submit signed URL. Attachment validates matching slug, HEAD and full image bytes; missing object400, invalid provider image502, unavailable503, timeout504. GET/list sign locally without storage reads; unavailable signer preserves metadata/location with null preview. Cache-Control:no-store. Admin/Super Admin bearer authentication inherited. Invalid input 400, missing convention 404, duplicate/state conflict 409, database failure 500. List all enabled and disabled conventions with stable created_at/id ordering. Optional preorder_enabled=true/false is strict. Returns 200 {items,page,per_page,has_next}. Safe error examples: 400 {"error":"Invalid convention request body"}; 404 {"error":"Convention not found"}; 500 {"error":"Internal server error"}.'
url: "{{server}}/v1/admin/conventions?page=1&per_page=25"
method: GET
queryParams:
  page: "1"
  per_page: "25"
scripts:
  - type: afterResponse
    code: ""
    language: text/javascript
order: 1000
