$kind: http-request
description: "Admin/Super Admin bearer authentication inherited. Invalid input 400, missing convention 404, duplicate/state conflict 409, database failure 500. Returns current membership IDs, parent/Shopify IDs, exact major-unit prices and UTC timestamps with 200 {items,page,per_page,has_next}. Safe error examples: 400 {\"error\":\"Invalid convention request body\"}; 404 {\"error\":\"Convention not found\"}; 500 {\"error\":\"Internal server error\"}. Selected variants expose Shopify display snapshots from the last required validation; GET uses PostgreSQL only. New or changed selections and PUT while enabled refresh snapshots atomically with final_price; an unchanged disabled PUT preserves metadata and timestamps without Shopify. PATCH enabling validates without refreshing snapshots. Explicit null SKU/images clear old values on refresh; absent variant images never fall back to product images. Legacy rows return null display fields until a validated save; no automatic backfill. Complete item example: {\"id\":\"00000000-0000-4000-8000-000000000002\",\"convention_id\":\"00000000-0000-4000-8000-000000000001\",\"shopify_product_id\":\"gid://shopify/Product/123\",\"shopify_variant_id\":\"gid://shopify/ProductVariant/456\",\"final_price\":\"12.99\",\"product_title\":\"Sticker\",\"variant_title\":\"Blue\",\"sku\":\"STICKER-BLUE\",\"product_image\":{\"url\":\"https://example.test/product.png\",\"alt_text\":null},\"variant_image\":{\"url\":\"https://example.test/variant.png\",\"alt_text\":\"Blue sticker\"},\"created_at\":\"2026-10-23T00:00:00Z\",\"updated_at\":\"2026-10-23T00:00:00Z\"}. Nullable legacy item example: {\"id\":\"00000000-0000-4000-8000-000000000002\",\"convention_id\":\"00000000-0000-4000-8000-000000000001\",\"shopify_product_id\":\"gid://shopify/Product/123\",\"shopify_variant_id\":\"gid://shopify/ProductVariant/456\",\"final_price\":\"12.99\",\"product_title\":null,\"variant_title\":null,\"sku\":null,\"product_image\":null,\"variant_image\":null,\"created_at\":\"2026-10-23T00:00:00Z\",\"updated_at\":\"2026-10-23T00:00:00Z\"}."
url: "{{server}}/v1/admin/conventions/{{convention_id}}/variants?page=1&per_page=25"
method: GET
queryParams:
  page: "1"
  per_page: "25"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.eql(200));
    language: text/javascript
order: 6000
