$kind: http-request
description: "Admin/Super Admin bearer authentication inherited. Invalid input 400, missing convention 404, duplicate/state conflict 409, database failure 500. Returns the complete saved convention DTO with 200. Replace convention_id using the create response. Safe error examples: 400 {\"error\":\"Invalid convention request body\"}; 404 {\"error\":\"Convention not found\"}; 500 {\"error\":\"Internal server error\"}."
url: "{{server}}/v1/admin/conventions/{{convention_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.eql(200));
    language: text/javascript
order: 3000
