$kind: http-request
description: "Logo requests attach logo_url from upload; omit for no change, null to clear. Responses contain stable logo_url plus short-lived signed logo_preview_url and logo_preview_url_expires_at; never persist or submit signed URL. Attachment validates matching slug, HEAD and full image bytes; missing object400, invalid provider image502, unavailable503, timeout504. GET/list sign locally without storage reads; unavailable signer preserves metadata/location with null preview. Cache-Control:no-store. Admin/Super Admin bearer authentication inherited. Invalid input 400, missing convention 404, duplicate/state conflict 409, database failure 500. Returns the complete saved convention DTO with 200. Replace convention_id using the create response. Safe error examples: 400 {\"error\":\"Invalid convention request body\"}; 404 {\"error\":\"Convention not found\"}; 500 {\"error\":\"Internal server error\"}. This route rejects all nonempty query parameters with 400."
url: "{{server}}/v1/admin/conventions/{{convention_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.eql(200));
      if (pm.response.code === 200) { const image = pm.response.json(); pm.globals.set("convention_logo_preview_url", image.logo_preview_url); pm.globals.set("convention_logo_preview_url_expires_at", image.logo_preview_url_expires_at); }
    language: text/javascript
order: 3000
