$kind: http-request
description: "Admin/Super Admin bearer authentication inherited. Invalid input 400, missing convention 404, duplicate/state conflict 409, database failure 500. Atomically replace the complete set, at most 250 unique variant GIDs. Replace synthetic Shopify IDs with eligible ACTIVE/tracked/DENY variants. Returns 200 {items:[...]} retaining unchanged membership IDs. final_price is an exact decimal string in major units: THB12.99 persists NUMERIC12.99. Use items:[] to clear while disabled. Removed upstream items need no lookup. Unavailable client 503, unusable upstream 502, timeout 504. Safe error examples: 400 {\"error\":\"Invalid convention request body\"}; 404 {\"error\":\"Convention not found\"}; 500 {\"error\":\"Internal server error\"}. Success example fields: {\"items\":[{\"id\":\"00000000-0000-4000-8000-000000000002\",\"convention_id\":\"00000000-0000-4000-8000-000000000001\",\"shopify_product_id\":\"gid://shopify/Product/123\",\"shopify_variant_id\":\"gid://shopify/ProductVariant/456\",\"final_price\":\"12.99\"}]}."
url: "{{server}}/v1/admin/conventions/{{convention_id}}/variants"
method: PUT
body:
  type: json
  content: |-
    {
      "items": [
        {
          "shopify_product_id": "gid://shopify/Product/123",
          "shopify_variant_id": "gid://shopify/ProductVariant/456",
          "final_price": "12.99"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.eql(200));
    language: text/javascript
order: 7000
