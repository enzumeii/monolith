$kind: http-request
description: "Admin/Super Admin bearer authentication inherited. Invalid input 400, missing convention 404, duplicate/state conflict 409, database failure 500. Atomically replace the complete set, at most 250 unique variant GIDs. Replace synthetic Shopify IDs with eligible ACTIVE/tracked variants. Returns 200 {items:[...]} retaining unchanged membership IDs. final_price is an exact decimal string in major units: THB12.99 persists NUMERIC12.99. Use items:[] to clear while disabled. Removed upstream items need no lookup. Unavailable client 503, unusable upstream 502, timeout 504. Safe error examples: 400 {\"error\":\"Invalid convention request body\"}; 404 {\"error\":\"Convention not found\"}; 500 {\"error\":\"Internal server error\"}. Success example fields: {\"items\":[{\"id\":\"00000000-0000-4000-8000-000000000002\",\"convention_id\":\"00000000-0000-4000-8000-000000000001\",\"shopify_product_id\":\"gid://shopify/Product/123\",\"shopify_variant_id\":\"gid://shopify/ProductVariant/456\",\"final_price\":\"12.99\"}]}. This route rejects all nonempty query parameters with 400. Selected variants expose Shopify display snapshots and nullable inventory_policy from the last required validation; GET uses PostgreSQL only. New or changed selections and PUT while enabled refresh snapshots atomically with final_price; an unchanged disabled PUT preserves metadata and timestamps without Shopify. PATCH enabling validates without refreshing snapshots. Explicit null SKU/images clear old values on refresh; absent variant images never fall back to product images. Legacy rows return null display fields until a validated save; no automatic backfill. Saved images contain URLs only; DENY/CONTINUE are stored snapshots and both policies are accepted. Complete item example: {\"id\":\"00000000-0000-4000-8000-000000000002\",\"convention_id\":\"00000000-0000-4000-8000-000000000001\",\"shopify_product_id\":\"gid://shopify/Product/123\",\"shopify_variant_id\":\"gid://shopify/ProductVariant/456\",\"final_price\":\"12.99\",\"inventory_policy\":\"DENY\",\"product_title\":\"Sticker\",\"variant_title\":\"Blue\",\"sku\":\"STICKER-BLUE\",\"product_image\":{\"url\":\"https://example.test/product.png\"},\"variant_image\":{\"url\":\"https://example.test/variant.png\"},\"created_at\":\"2026-10-23T00:00:00Z\",\"updated_at\":\"2026-10-23T00:00:00Z\"}. Nullable legacy item example: {\"id\":\"00000000-0000-4000-8000-000000000002\",\"convention_id\":\"00000000-0000-4000-8000-000000000001\",\"shopify_product_id\":\"gid://shopify/Product/123\",\"shopify_variant_id\":\"gid://shopify/ProductVariant/456\",\"final_price\":\"12.99\",\"inventory_policy\":null,\"product_title\":null,\"variant_title\":null,\"sku\":null,\"product_image\":null,\"variant_image\":null,\"created_at\":\"2026-10-23T00:00:00Z\",\"updated_at\":\"2026-10-23T00:00:00Z\"}."
url: "{{server}}/v1/admin/conventions/{{convention_id}}/variants"
method: PUT
body:
  type: json
  content: |-
    {
      "items": [
        {
          "shopify_product_id": "gid://shopify/Product/123",
          "shopify_variant_id": "gid://shopify/ProductVariant/456",
          "final_price": "12.99"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Expected status", () => pm.expect(pm.response.code).to.eql(200));
    language: text/javascript
order: 7000
