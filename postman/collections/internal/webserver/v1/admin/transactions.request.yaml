$kind: http-request
description: |
  Build the accounting report using required RFC3339 date_from/date_to bounds (date_from must be earlier).
  Payout bounds are inclusive instants, including their offsets. PayPal fetches preceding-month context in
  windows of at most 31 days and returns only derived payouts inside the requested interval.
  Stripe balance and fee amounts must be settled in THB; unsupported settlement currencies return safe 502.
  Inherits bearer access_token. No provider records returns {"transactions":[],"items":[]}.
  Example THB settlement values: {"net_paid":3480,"fee":100,"vat":20,"gross_paid":3600,"exchange_rate":36}.
  Error examples: 400 {"error":"Expected valid RFC3339 date_from and date_to values with date_from before date_to"};
  503 {"error":"Accounting report provider unavailable"}; 502/504 {"error":"Upstream request failed"}.
url: "{{server}}/v1/admin/transactions?date_from=2026-10-01T00:00:00%2B07:00&date_to=2026-10-31T23:59:59%2B07:00"
method: GET
queryParams:
  date_from: 2026-10-01T00:00:00+07:00
  date_to: 2026-10-31T23:59:59+07:00
order: 2000
