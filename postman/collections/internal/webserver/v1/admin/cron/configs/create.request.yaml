$kind: http-request
description: Create a disabled Bangkok transaction report schedule. Save the returned id as cron_configuration_id to use the related requests.
url: "{{server}}/v1/admin/cron/configs"
method: POST
body:
  type: json
  content: |-
    {
    	"name": "Monthly transaction report",
    	"report_type": "TRANSACTION",
    	"cron_expression": "0 9 1 * *",
    	"receiver_email": "reports@example.com",
    	"parameter": "PREVIOUS_MONTH",
    	"enabled": false
    }
scripts:
  - type: afterResponse
    code: ""
    language: text/javascript
order: 2000
