$kind: http-request
description: 'Set order_id to a positive numeric Shopify order ID. Bodyless POST with no query parameters. Looks up order contact, adds RETURNED without replacing unrelated tags, then sends the returned-parcel notice from shipping@enzumeii.com. Every explicit POST sends another notice, including when RETURNED already exists. No automatic email retries. HTTP200 {success:true} means provider acceptance, not delivery. Input400; auth401; missing order404; missing email409; upstream502/504; unavailable client or reship timeout503. RETURNED remains if email fails; inspect outcomes before repeating an ambiguous request. Inherits bearer access_token. This request sends email: use an isolated test environment.'
url: '{{server}}/v1/admin/orders/{{order_id}}/reship'
method: POST
order: 5000
examples: ./.resources/reship.resources/examples
