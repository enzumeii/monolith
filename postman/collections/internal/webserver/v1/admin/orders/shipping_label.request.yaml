$kind: http-request
description: Generate all PACKING labels for open paid unfulfilled orders. Returns fastship/thaipost/best/teleport arrays. Adds SHIPPING and courier tag, then removes PACKING per order. No date tag. Later failure may leave earlier tag changes applied; inspect orders before repeating. Extra query parameters are ignored. Items and shipping methods are selected together, each fixed at first250; root order pages are traversed. Inherits bearer access_token. missing method 409; upstream 502/504; unavailable 503.
url: '{{server}}/v1/admin/orders/shipping_label'
method: POST
order: 3000
examples: ./.resources/shipping_label.resources/examples
