$kind: http-request
description: Summarize all matching orders. Set order_tag to one tag or comma-separated tags such as SHIPPING,TEST; every tag must match (AND). Empty entries return 400.
url: "{{server}}/v1/admin/orders/report?tags=tag"
method: GET
queryParams:
  - key: tags
    value: tag
    disabled: false
    description: ""
order: 1000
