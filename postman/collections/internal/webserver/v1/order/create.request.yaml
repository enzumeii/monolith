$kind: http-request
description: "Optional note is plain customer fulfillment text (maximum 2000 Unicode characters; tab and line breaks allowed, other controls rejected). Omit it for no note. It is carried to Shopify native order note, never provider metadata or the local database. Retrying the same operation requires identical note text. Set vault:checkout_guest_secret privately to a cryptographically random 32-byte secret encoded as 64 hex characters; do not use an admin access JWT. Save this secret and the random v4 checkout_id before create. The operation ID equals checkout ID. Synthetic IDs must be replaced with actual convention UUID, public catalogue ProductVariant GID (or compatible internal variant UUID), and an unused random operation UUID. The selected variant must belong to this convention; UUID/GID aliases resolving to the same variant are rejected. Requests mutate the selected Shopify/payment account; use controlled fixtures or intended Sandbox only. Select checkout_provider stripe or paypal and exact displayed checkout_currency/checkout_unit_price (integer minor units). Reuse identical intent/ID/secret after a lost response. Shopify retains purchase details; the local database stores only control hashes and resource links. If creation was attempted but no unique draft can be recovered, reconcile rather than create another draft. Changed intent with same ID is 409. Success 200 example: {\"checkout_id\":\"00000000-0000-4000-8000-000000000048\",\"status\":\"requires_action\",\"money\":{\"minor\":1000,\"currency\":\"USD\"},\"reservation_expires_at\":\"2028-01-01T01:00:00Z\",\"next_action\":{\"type\":\"redirect\",\"url\":\"https://checkout.stripe.com/c/pay/cs_test_synthetic\"}}. Money is server authoritative; redirect is not proof of payment. A recovered completed/unpaid Stripe session returns processing with no next_action even when the provider URL is null; paid recovery verifies the same resource and may return completed. Failures: 400 malformed request, 401 guest credential, 409 unavailable convention/variant or changed price/eligibility, 503 configuration/dependency, 502/504 upstream, sanitized 500 database. Safe example 400 {\"error\":\"Invalid checkout request body\"}. Unknown fields and nonempty queries are rejected."
url: "{{server}}/v1/order/checkout"
method: POST
order: 1000
auth:
  type: bearer
  credentials:
    token: "{{vault:checkout_guest_secret}}"
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
      "operation_id": "{{checkout_id}}",
      "convention_id": "{{checkout_convention_id}}",
      "email": "buyer@example.com",
      "provider": "{{checkout_provider}}",
      "items": [{"variant_id": "{{checkout_variant_id}}", "quantity": 1, "expected_unit_price": {{checkout_unit_price}}}],
      "expected_currency": "{{checkout_currency}}",
      "note": "Please pack as a gift.\nThank you!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Checkout accepted", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        pm.test("Known checkout state", () => pm.expect(result.status).to.be.oneOf(["requires_action", "processing", "unpaid", "reconciliation_required", "completed"]));
        pm.test("No contact disclosure", () => pm.expect(result).not.to.have.property("email"));
      }
