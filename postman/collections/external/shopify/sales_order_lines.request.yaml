$kind: graphql-request
url: "{{shopify}}/graphql.json"
description: "Read-only sales-report order ID and line projection. Use a test-store ID and local vault credentials."
query: |
  query SalesOrderLines($id: ID!) {
    order(id: $id) {
      id
      lineItems(first: 250) {
        nodes {
          id
          title
          variantTitle
          sku
          quantity
          currentQuantity
          product {
            id
          }
          variant {
            id
          }
          originalUnitPriceSet {
            shopMoney {
              amount
              currencyCode
            }
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
variables: |
  {
    "id": "gid://shopify/Order/123"
  }
settings: {}
schema:
  source: auto
order: 3100
