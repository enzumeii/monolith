$kind: graphql-request
description: Activate one variant inventory item at a location using item/location IDs and a stable idempotency key only. No quantity arguments are sent. Requires write_inventory and activation permission. Reuse the UUID only for retries of the same operation; live provider quantity behavior is not verified by local tests.
url: "{{shopify}}/graphql.json"
query: |
  mutation ActivateExistingInventory(
  	$inventoryItemId: ID!
  	$locationId: ID!
  	$idempotencyKey: String!
  ) {
  	inventoryActivate(inventoryItemId: $inventoryItemId, locationId: $locationId) @idempotent(key: $idempotencyKey) {
  		inventoryLevel {
  			id
  			isActive
  			quantities(names: ["available", "on_hand"]) {
  				name
  				quantity
  			}
  		}
  		userErrors {
  			field
  			message
  		}
  	}
  }
variables: |-
  {
  	"inventoryItemId": "gid://shopify/InventoryItem/49697008189611",
  	"locationId": "gid://shopify/Location/90340917419",
  	"idempotencyKey": "e554f27d-d18f-4d6a-981e-f15b7aad81dc"
  }
settings: {}
schema:
  source: auto
order: 7000
