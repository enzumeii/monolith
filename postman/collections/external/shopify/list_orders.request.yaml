$kind: graphql-request
description: "Requires Shopify token in local vault. Sample variables match the reship lookup: first=1, name:1085, includeContact=true. For listing, use tag/fulfillment search with includeContact=true, includeTags=false and requested page size/cursor to return order email/customer firstName/lastName and shippingAddress.countryCodeV2. Tag reads reuse id:42 with includeContact=false and includeTags=true. Supply both Boolean flags explicitly; provider defaults are not relied on. Synthetic IDs must be replaced with test-store IDs. Returns selected data and pageInfo where applicable. Mutation userErrors, GraphQL errors and missing payloads are failures. Do not run mutations against production during verification."
url: "{{shopify}}/graphql.json"
query: |
  query ListOrders(
    $first: Int!
    $after: String
    $search: String!
    $includeContact: Boolean!
    $includeTags: Boolean!
  ) {
    orders(
      first: $first
      after: $after
      query: $search
      sortKey: CREATED_AT
      reverse: true
    ) {
      nodes {
        id
        number
        name @include(if: $includeTags)
        tags @include(if: $includeTags)
        customer @include(if: $includeContact) {
          firstName
          lastName
        }
        shippingAddress @include(if: $includeContact) {
          countryCodeV2
        }
        email @include(if: $includeContact)
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
variables: |
  {
    "first": 1,
    "after": null,
    "search": "name:1085",
    "includeContact": true,
    "includeTags": false
  }
settings: {}
schema:
  source: auto
order: 3000
