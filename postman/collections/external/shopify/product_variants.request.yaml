$kind: graphql-request
url: "{{shopify}}/graphql.json"
query: |
  query ProductVariants($id: ID!, $locationId: ID!, $after: String) {
    product(id: $id) {
      id
      variants(first: 100, after: $after) {
        nodes {
          id title sku
          image { url }
          contextualPricing(context: { locationId: $locationId }) { price { amount currencyCode } }
          inventoryItem {
            id tracked
            unitCost { amount currencyCode }
            measurement { weight { value unit } }
            inventoryLevel(locationId: $locationId) { id isActive quantities(names: ["on_hand", "available"]) { name quantity } }
          }
        }
        pageInfo { hasNextPage endCursor }
      }
    }
  }
variables: |-
  {
    "id": "gid://shopify/Product/123",
    "locationId": "gid://shopify/Location/123",
    "after": null
  }
settings: {}
schema:
  source: auto
order: 2950
