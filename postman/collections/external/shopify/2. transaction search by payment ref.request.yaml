$kind: graphql-request
url: "{{shopify}}/graphql.json"
query: |
  query OrdersByPayment($search: String!, $after: String) {
    orders(first: 250, after: $after, query: $search) {
      nodes {
        id
        name
        number
        createdAt
        displayFinancialStatus
        displayFulfillmentStatus
        tags
        email
        phone
        shippingAddress {
          name
          address1
          address2
          city
          zip
          countryCode
          phone
        }
        currentTotalPriceSet {
          shopMoney {
            amount
            currencyCode
          }
        }
        transactions {
          id
          paymentId
          gateway
          kind
          status
          processedAt
          amountSet {
            shopMoney {
              amount
              currencyCode
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
variables: |-
  {
    "search": "payment_id:\"rHcValeeIeFNcVxAMawcQeFqt\"",
    "after": null
  }
settings: {}
schema:
  source: auto
order: 2965
