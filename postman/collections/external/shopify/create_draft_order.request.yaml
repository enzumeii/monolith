$kind: graphql-request
description: |
  Creates a Shopify draft order. Requires the inherited Shopify access token in
  the local vault, the shopify environment URL, write_draft_orders permission,
  and real test-store variant IDs replacing the synthetic ID. Use a suitable
  future reserveInventoryUntil for the test; omit it to request no reservation.
  Omitting priceOverride uses Shopify catalogue prices. Callers may explicitly
  supply an optional line-item priceOverride with amount and currencyCode.
  Contact/address and tags are caller supplied. Optional sessionToken identifies
  the draft; it does not guarantee deduplication across invocations.
  Execution creates a draft: do not run this mutation against production during
  verification or retry an ambiguous failure automatically.

  Expected HTTP 200 success body:
  {"data":{"draftOrderCreate":{"draftOrder":{"id":"gid://shopify/DraftOrder/42","name":"#D42","email":"buyer@example.test","phone":"+66000000000","tags":["ENZ-42-TEST","RESERVED-CHECKOUT"],"reserveInventoryUntil":"2099-01-01T00:00:00Z"},"userErrors":[]}}}

  Provider rejection may also return HTTP 200:
  {"data":{"draftOrderCreate":{"draftOrder":null,"userErrors":[{"field":["input","lineItems","0","variantId"],"message":"Variant not found"}]}}}
  Inspect userErrors even on HTTP 200. GraphQL errors and HTTP failures are
  separate failures; live merchant acceptance and inventory holds are unverified.
url: "{{shopify}}/graphql.json"
query: |
  mutation CreateDraftOrder($input: DraftOrderInput!) {
    draftOrderCreate(input: $input) {
      draftOrder {
        id
        name
        email
        phone
        tags
        reserveInventoryUntil
      }
      userErrors {
        field
        message
      }
    }
  }
variables: |
  {
    "input": {
      "email": "buyer@example.test",
      "phone": "+66000000000",
      "shippingAddress": {
        "firstName": "Example",
        "lastName": "Buyer",
        "address1": "1 Example Road",
        "city": "Bangkok",
        "provinceCode": "TH-10",
        "countryCode": "TH",
        "zip": "10000"
      },
      "lineItems": [
        {
          "variantId": "gid://shopify/ProductVariant/123",
          "quantity": 2
        }
      ],
      "tags": [
        "ENZ-42-TEST",
        "RESERVED-CHECKOUT"
      ],
      "presentmentCurrencyCode": "THB",
      "reserveInventoryUntil": "2099-01-01T00:00:00Z",
      "sessionToken": "synthetic-session-token-42"
    }
  }
settings: {}
schema:
  source: auto
order: 8000
