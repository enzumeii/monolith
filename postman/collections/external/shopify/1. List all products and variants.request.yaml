$kind: graphql-request
url: "{{shopify}}/graphql.json"
query: |
  query ProductsWithVariants(
    $first: Int!
    $variantsFirst: Int!
    $locationId: ID!
    $search: String
    $after: String
  ) {
    products(first: $first, after: $after, query: $search, sortKey: CREATED_AT) {
      nodes {
        id
        title
        productType
        description
        status
        tags
        featuredImage {
          url
        }
        variants(first: $variantsFirst) {
          nodes {
            id
            title
            sku
            contextualPricing(context: { locationId: $locationId }) {
              price {
                amount
                currencyCode
              }
            }
            image {
              url
            }
            inventoryItem {
              id
              tracked
              unitCost {
                amount
                currencyCode
              }
              measurement {
                weight {
                  value
                  unit
                }
              }
              inventoryLevel(locationId: $locationId) {
                id
                isActive
                quantities(names: ["on_hand", "available"]) {
                  name
                  quantity
                }
              }
            }
          }
          pageInfo {
            hasNextPage
            endCursor
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
variables: |
  {
    "locationId": "gid://shopify/Location/123",
    "search": "status:active",
    "after": null,
    "first": 10,
    "variantsFirst": 10
  }
settings: {}
schema:
  source: auto
order: 2935
