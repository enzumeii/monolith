$kind: graphql-request
name: 2. transaction search by payment ref
url: "{{shopify}}/graphql.json"
query: |
  query OrdersByPayment($first: Int!, $search: String!, $after: String) {
  	orders(first: $first, after: $after, query: $search) {
  		nodes {
  			id
  			number
  			tags
  			phone
  			shippingAddress {
  				name
  				address1
  				address2
  				city
  				provinceCode
  				zip
  				country
  				countryCodeV2
  				phone
  			transactions {
  				paymentId
  				gateway
  				kind
  				status
  				amountSet {
  					shopMoney {
  						amount
  						currencyCode
  					}
  				}
  				receiptJson
  			}
  			lineItems(first: 250) {
  				nodes {
  					title
  					variantTitle
  					sku
  					quantity
  					originalUnitPriceSet {
  						shopMoney {
  							amount
  							currencyCode
  						}
  					}
  				}
  				pageInfo {
  					hasNextPage
  					endCursor
  				}
  			}
  			shippingLines(first: 250) {
  				nodes {
  					priceSet: originalPriceSet {
  						shopMoney {
  							amount
  							currencyCode
  						}
  					}
  				}
  				pageInfo {
  					hasNextPage
  					endCursor
  				}
  			}
  			refunds(first: 250) {
  				transactions(first: 250) {
  					nodes {
  						paymentId
  						gateway
  						kind
  						status
  						amountSet {
  							shopMoney {
  								amount
  								currencyCode
  							}
  						}
  						receiptJson
  					}
  					pageInfo {
  						hasNextPage
  						endCursor
  					}
  				}
  				refundShippingLines(first: 250) {
  					nodes {
  						subtotalAmountSet {
  							shopMoney {
  								amount
  								currencyCode
  							}
  						}
  					}
  					pageInfo {
  						hasNextPage
  						endCursor
  					}
  				}
  				refundLineItems(first: 250) {
  					nodes {
  						quantity
  						subtotalSet {
  							shopMoney {
  								amount
  								currencyCode
  							}
  						}
  						lineItem {
  							title
  							variantTitle
  							sku
  							quantity
  							originalUnitPriceSet {
  								shopMoney {
  									amount
  									currencyCode
  								}
  							}
  						}
  					}
  					pageInfo {
  						hasNextPage
  						endCursor
  					}
  				}
  			}
  		}
  		pageInfo {
  			hasNextPage
  			endCursor
  		}
  	}
  }
variables: |-
  {
  	"search": "payment_id:\"fixture-reference\"",
  	"first": 10,
  	"after": null
  }
settings: {}
schema:
  source: auto
order: 2969
