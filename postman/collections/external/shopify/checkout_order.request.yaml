$kind: graphql-request
description: "Read the exact saved real order independently of accounting date searches. Verify PAID, UNFULFILLED, zero shipping and immutable accepted checkout snapshot. Missing fields, GraphQL errors and lineItems hasNextPage true fail explicitly; nullable order is unavailable. Reads only convention_checkout/payment_references metadata, preserving unrelated metadata."
url: "{{shopify}}/graphql.json"
query: |
  query CheckoutOrder($id: ID!) {
    order(id: $id) {
      id
      displayFinancialStatus
      displayFulfillmentStatus
      cancelledAt
      email
      phone
      customAttributes {
        key
        value
      }
      tags
      taxesIncluded
      totalPriceSet {
        presentmentMoney {
          amount
          currencyCode
        }
      }
      totalShippingPriceSet {
        presentmentMoney {
          amount
          currencyCode
        }
      }
      lineItems(first: 250) {
        nodes {
          variant {
            id
          }
          quantity
          originalUnitPriceSet {
            presentmentMoney {
              amount
              currencyCode
            }
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
      metafield(namespace: "convention_checkout", key: "payment_references") {
        value
        compareDigest
      }
    }
  }
variables: |
  {
    "id": "gid://shopify/Order/123"
  }
settings: {}
schema:
  source: auto
order: 3602
