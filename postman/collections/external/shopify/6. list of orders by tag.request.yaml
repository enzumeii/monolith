$kind: graphql-request
url: "{{shopify}}/graphql.json"
query: |
  query OrdersByTag($first: Int!, $search: String!, $after: String) {
    orders(
      first: $first
      after: $after
      query: $search
      sortKey: CREATED_AT
      reverse: true
    ) {
      nodes {
        id
        number
        tags
        email
        phone
        lineItems(first: 250) {
          nodes {
            title
            variantTitle
            sku
            quantity
            originalUnitPriceSet {
              shopMoney {
                amount
                currencyCode
              }
            }
            product {
              productType
            }
            variant {
              inventoryItem {
                unitCost {
                  amount
                  currencyCode
                }
                measurement {
                  weight {
                    value
                    unit
                  }
                }
              }
            }
          }
          pageInfo {
            hasNextPage
            endCursor
          }
        }
        currentTotalPriceSet {
          shopMoney {
            amount
            currencyCode
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
variables: |
  {
    "search": "tag:\"shipping\"",
    "after": null,
    "first": 250
  }
settings: {}
schema:
  source: auto
order: 8000
