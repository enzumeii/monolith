$kind: http-request
description: "Read a saved mapped order by its real ID even when outside accounting date discovery. The shared complete selection preserves tags and existing native refund/item details. Replace the synthetic ID with an authorized stored order ID. Requires read_orders and read_all_orders where applicable. Success: {\"data\":{\"order\":{\"id\":\"gid://shopify/Order/123\",\"tags\":[\"Convention\",\"Portal\"]}}} plus the requested accounting fields. Null order, wrong returned ID, truncated nested connections, currency/quantity/price mismatch or GraphQL errors must fail local enrichment, never silently report an unmatched saved order."
url: "{{shopify}}/graphql.json"
method: POST
body:
  type: json
  content: |-
    {
      "operationName": "AccountingOrder",
      "query": "query OrdersByPayment($first: Int!, $search: String!, $after: String) {\n  orders(first: $first, after: $after, query: $search) {\n    nodes {\n      ...AccountingOrder\n    }\n    pageInfo {\n      hasNextPage\n      endCursor\n    }\n  }\n}\nquery AccountingOrder($id: ID!) {\n  order(id: $id) {\n    ...AccountingOrder\n  }\n}\nfragment AccountingOrder on Order {\n  id\n  number\n  tags\n  totalPriceSet {\n    shopMoney {\n      amount\n      currencyCode\n    }\n    presentmentMoney {\n      amount\n      currencyCode\n    }\n  }\n  totalShippingPriceSet {\n    shopMoney {\n      amount\n      currencyCode\n    }\n    presentmentMoney {\n      amount\n      currencyCode\n    }\n  }\n  phone\n  shippingAddress {\n    name\n    address1\n    address2\n    city\n    provinceCode\n    zip\n    country\n    countryCodeV2\n    phone\n  }\n  transactions {\n    paymentId\n    gateway\n    kind\n    status\n    amountSet {\n      shopMoney {\n        amount\n        currencyCode\n      }\n    }\n    receiptJson\n  }\n  lineItems(first: 250) {\n    nodes {\n      variant {\n        id\n      }\n      title\n      variantTitle\n      sku\n      quantity\n      originalUnitPriceSet {\n        presentmentMoney {\n          amount\n          currencyCode\n        }\n        shopMoney {\n          amount\n          currencyCode\n        }\n      }\n    }\n    pageInfo {\n      hasNextPage\n      endCursor\n    }\n  }\n  shippingLines(first: 250) {\n    nodes {\n      priceSet: originalPriceSet {\n        shopMoney {\n          amount\n          currencyCode\n        }\n      }\n    }\n    pageInfo {\n      hasNextPage\n      endCursor\n    }\n  }\n  refunds(first: 250) {\n    transactions(first: 250) {\n      nodes {\n        paymentId\n        gateway\n        kind\n        status\n        amountSet {\n          shopMoney {\n            amount\n            currencyCode\n          }\n        }\n        receiptJson\n      }\n      pageInfo {\n        hasNextPage\n        endCursor\n      }\n    }\n    refundShippingLines(first: 250) {\n      nodes {\n        subtotalAmountSet {\n          shopMoney {\n            amount\n            currencyCode\n          }\n        }\n      }\n      pageInfo {\n        hasNextPage\n        endCursor\n      }\n    }\n    refundLineItems(first: 250) {\n      nodes {\n        quantity\n        subtotalSet {\n          shopMoney {\n            amount\n            currencyCode\n          }\n        }\n        lineItem {\n          variant {\n            id\n          }\n          title\n          variantTitle\n          sku\n          quantity\n          originalUnitPriceSet {\n            presentmentMoney {\n              amount\n              currencyCode\n            }\n            shopMoney {\n              amount\n              currencyCode\n            }\n          }\n        }\n      }\n      pageInfo {\n        hasNextPage\n        endCursor\n      }\n    }\n  }\n}\n",
      "variables": {
        "id": "gid://shopify/Order/123"
      }
    }
order: 2966
