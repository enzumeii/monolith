$kind: graphql-request
description: "Sets one narrowly owned JSON metafield, never native gateway/paymentId/receiptJson. Requires the order write scope. compareDigest null creates only when absent; a later same-payment alias extension uses the previously read digest, while conflicting metadata is an operator exception. Success requires one returned metafield and empty userErrors, then a separate CheckoutOrder readback of the exact persisted JSON. Mutations are single-attempt; metadata failures resume against saved order and never repeat draft completion. Safe synthetic variables must be replaced only for authorized development-store checks."
url: "{{shopify}}/graphql.json"
query: |
  mutation SetCheckoutPaymentMetadata($metafields: [MetafieldsSetInput!]!) {
    metafieldsSet(metafields: $metafields) {
      metafields {
        namespace
        key
        value
      }
      userErrors {
        field
        message
      }
    }
  }
variables: |
  {
    "metafields": [
      {
        "ownerId": "gid://shopify/Order/123",
        "namespace": "convention_checkout",
        "key": "payment_references",
        "type": "json",
        "value": "{\"checkout_id\":\"00000000-0000-4000-8000-000000000001\",\"draft_id\":\"gid://shopify/DraftOrder/123\",\"attempt_id\":\"synthetic-attempt\",\"provider\":\"STRIPE\",\"account\":\"acct_synthetic\",\"environment\":\"TEST\",\"amount\":{\"minor\":12345,\"currency\":\"THB\",\"precision\":2},\"aliases\":[{\"kind\":\"STRIPE_CHARGE\",\"value\":\"ch_synthetic\"}]}",
        "compareDigest": null
      }
    ]
  }
settings: {}
schema:
  source: auto
order: 3603
