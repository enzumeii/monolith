$kind: graphql-request
url: "{{shopify}}/graphql.json"
query: |
  query SoldVariantsInRange(
    $first: Int!
    $search: String!
    $ordersAfter: String
  ) {
    orders(
      first: $first
      after: $ordersAfter
      query: $search
      sortKey: CREATED_AT
    ) {
      nodes {
        id
        name
        createdAt
        cancelledAt
        test
        displayFulfillmentStatus
        displayFinancialStatus
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
variables: |
  {
    "search": "created_at:>='2026-09-01T00:00:00+07:00' created_at:<'2026-09-30T00:00:00+07:00' test:false",
    "ordersAfter": null,
    "first": 10
  }
settings: {}
schema:
  source: auto
order: 3000
