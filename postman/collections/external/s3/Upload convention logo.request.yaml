$kind: http-request
description: "Private S3 image operation for server-generated conventions/<slug>/<UUID>.png or .jpg location. Set convention_logo_location from authenticated upload response. Backend validates HEAD metadata and full GET image bytes before attaching to convention. PNG/JPEG Content-Type; missing404, provider403/5xx. Browser image rendering uses Read signed image without AWS credentials."
url: "{{s3_endpoint}}/reports/{{convention_logo_location}}"
method: PUT
order: 4000
auth:
  type: inherit
  credentials:
    id: 50da802f-f8d1-4fe8-8ac7-f8c61c3962ae
headers:
  Content-Type: image/png
body:
  type: file
  content:
    src: postman/fixtures/convention-logo.png
scripts:
  - type: afterResponse
    code: |-
      pm.test("Stored", () => pm.response.to.have.status(200));
    language: text/javascript
