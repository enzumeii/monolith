$kind: http-request
description: "Unauthenticated browser-equivalent GET using full signed URL from upload or convention GET. No inherited AWS or bearer authentication. 200 image/png or image/jpeg bytes; expired/tampered signature403; missing404. Refresh via convention GET to obtain a new URL; a previously issued URL can remain usable until expiry after clear/replacement."
url: "{{convention_logo_url}}"
method: GET
order: 7000
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Signed image readable", () => { pm.response.to.have.status(200); pm.expect(pm.response.headers.get("Content-Type")).to.match(/^image\/(png|jpeg)/); });
    language: text/javascript
