$kind: http-request
description: 'Expire only an open stripe_checkout_session_id. This is a mutation. Use a distinct stripe_checkout_expire_idempotency_key for this expire operation and preserve it on retry. 200 partial example: {"id":"cs_test_synthetic","object":"checkout.session","status":"expired","payment_status":"unpaid","livemode":false}. 400 Session already complete/expired; 404 unknown Session; 409 idempotency conflict. An expiry rejection or network ambiguity is not proof of nonpayment: retrieve current state and verify it. Uses inherited vault:stripe_secret_key (test secret for manual sandbox use) and stripe base URL including /v1. No Stripe-Account or Stripe-Version header: direct account, account-default API version. Common failures: 401 authentication, 403 permissions, 429 rate limit or 5xx provider failure. Synthetic error: {"error":{"type":"invalid_request_error","code":"resource_missing","message":"No such resource"}}. Examples are partial synthetic objects, never evidence of a paid payment.'
url: "{{stripe}}/checkout/sessions/:session_id/expire"
method: POST
order: 7000
pathVariables:
  session_id: "{{stripe_checkout_session_id}}"
headers:
