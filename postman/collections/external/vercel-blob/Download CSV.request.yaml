$kind: http-request
description: 'Fetch the provider-returned public download URL without a bearer token. Run upload/metadata first to populate blob_download_url, or set it explicitly. Success 200 returns identical CSV bytes and text/csv content type; a missing object is 404. This request never triggers report generation.'
url: "{{blob_download_url}}"
method: GET
order: 3000
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: 'pm.test("Original public CSV bytes", function () { pm.response.to.have.status(200); pm.expect(pm.response.headers.get("Content-Type")).to.include("text/csv"); pm.expect(pm.response.text()).to.eql("id,title\n1,synthetic\n"); });'
    language: text/javascript
