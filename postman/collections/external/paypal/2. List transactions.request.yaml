$kind: http-request
description: >-
  Reads the selected PayPal environment's reporting transactions for an elapsed
  date range. Reporting can lag completed captures; use the returned
  last_refreshed_datetime to assess availability. HTTP 200 may omit
  transaction_details only for an explicitly empty first page:
  {"page":1,"total_items":0,"total_pages":0}. A present list must be an array;
  missing nonempty results, explicit null and malformed metadata are not empty
  reports. Replace the synthetic date range with the intended reporting period.
url: "{{paypal}}/v1/reporting/transactions?start_date=2026-10-01T00:00:00Z&end_date=2026-10-02T00:00:00Z&fields=all&page_size=500&page=1"
method: GET
queryParams:
  start_date: 2026-10-01T00:00:00Z
  end_date: 2026-10-02T00:00:00Z
  fields: all
  page_size: "500"
  page: "1"
order: 2000
auth:
  type: inherit
  credentials:
    id: 5daed635-8af6-4e64-9242-a4be048bc73a
scripts:
  - type: afterResponse
    code: |-
      pm.test("Reporting request succeeds", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Report includes transactions or an explicit empty first page", function () {
        const page = pm.response.json();
        if (Object.prototype.hasOwnProperty.call(page, "transaction_details")) {
          pm.expect(page.transaction_details).to.be.an("array");
        } else {
          pm.expect(page.page).to.equal(1);
          pm.expect(page.total_items).to.equal(0);
          pm.expect(page.total_pages).to.equal(0);
        }
      });
    language: text/javascript
