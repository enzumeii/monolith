$kind: http-request
description: "Required: paypal API base URL and all paypal_auth_algo, paypal_cert_url, paypal_transmission_id, paypal_transmission_sig, paypal_transmission_time, paypal_webhook_id, paypal_webhook_event_json variables; bearer uses local vault paypal_access_token. Set event JSON to the unchanged received event object and transmission values to received PayPal headers. This posts verification to configured PayPal API; cert_url is payload only. Success 200 returns verification_status SUCCESS or FAILURE. Only SUCCESS authenticates the event; retrieve capture independently before accepting payment. Failures 400/401/403/429/5xx."
url: "{{paypal}}/v1/notifications/verify-webhook-signature"
method: POST
order: 7000
body:
  type: json
  content: |-
    {
      "auth_algo": "{{paypal_auth_algo}}",
      "cert_url": "{{paypal_cert_url}}",
      "transmission_id": "{{paypal_transmission_id}}",
      "transmission_sig": "{{paypal_transmission_sig}}",
      "transmission_time": "{{paypal_transmission_time}}",
      "webhook_id": "{{paypal_webhook_id}}",
      "webhook_event": {{paypal_webhook_event_json}}
    }
headers:
  Content-Type: application/json
auth:
  type: inherit
  credentials:
    id: 5daed635-8af6-4e64-9242-a4be048bc73a
scripts:
  - type: afterResponse
    language: text/javascript
    code: "pm.test(\"Provider response contract\", function () { pm.response.to.have.status(200); pm.expect([\"SUCCESS\",\"FAILURE\"]).to.include(pm.response.json().verification_status); });"
