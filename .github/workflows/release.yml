name: Release

on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
    branches: [main]

jobs:
  release:
    concurrency:
      group: main-releases
      cancel-in-progress: false
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted main and full release history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json
      - name: Install Conventional Commits parser
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund
      - name: Publish releases for unreleased merged PRs
        uses: actions/github-script@v8
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const baseline = '2f9f9101ad5348c327c75c4504a5827975497ada';
            execFileSync('git', ['merge-base', '--is-ancestor', baseline, 'HEAD']);
            const commits = execFileSync('git', ['rev-list', '--first-parent', '--reverse', baseline + '..HEAD'], {encoding: 'utf8'}).trim().split('\n').filter(Boolean);
            const {publishReleases} = require('./.github/scripts/release.cjs');
            const result = await publishReleases({github, ...context.repo, commits});
            core.info(JSON.stringify(result));

  deploy:
    concurrency:
      group: vercel-production-deployments
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Validate deployment credentials
        shell: bash
        env:
          SUPABASE_MIGRATION_DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_MIGRATION_DATABASE_URL; do
            if [ -z "${!name}" ]; then
              printf '::error::Missing required GitHub Actions secret: %s\n' "$name" >&2
              exit 1
            fi
          done
      - name: Check out the selected main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned Vercel CLI and validate services
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:vercel
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Install pinned PostgreSQL migration CLI
        shell: bash
        run: cargo install --locked sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls
      - name: Migrate Supabase before deployment
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
        run: |
          sqlx --no-dotenv migrate run --source services/api/migrations
      - name: Deploy all services to production
        shell: bash
        run: |
          deployment_url="$(./node_modules/.bin/vercel deploy --prod --yes)"
          printf '### Vercel production deployment\n\n%s\n\nServices: backoffice, client-ui, api.\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
