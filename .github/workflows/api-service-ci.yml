name: API Service CI

on:
  push:
    branches: 
      - main
    paths:
      - 'services/api/**'
      - 'crates/models/**'
      - '.github/workflows/api-service-ci.yml'
  pull_request:
    branches: 
      - main
    paths:
      - 'services/api/**'
      - 'crates/models/**'
      - '.github/workflows/api-service-ci.yml'

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true   # Forces SQLx to use the committed .sqlx folder

jobs:
  lint-and-check:
    name: Lint & SQLx Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check -p api

      - name: Verify SQLx Metadata is Fresh
        working-directory: services/api
        run: cargo sqlx prepare --check

      - name: Run Clippy
        run: cargo clippy -p api --all-targets -- -D warnings
