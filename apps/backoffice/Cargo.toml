[package]
name = "backoffice"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
dioxus = { version="0.7.10", features=["router"] }
domain = { path="../../crates/domain" }
reqwest.workspace = true
serde.workspace = true
toml = { version = "1.1.4", default-features = false, features = ["std", "serde", "parse"] }
web-time.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]

[dev-dependencies]
futures.workspace = true
