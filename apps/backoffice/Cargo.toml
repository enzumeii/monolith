[package]
name = "backoffice"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
domain = { path = "../../crates/domain" }
serde = { workspace = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
config = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }

[features]
default = []
# Fullstack web app: `web` is the only non-server renderer so `dx serve`
# autodetects the web platform.
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:reqwest",
    "dep:config",
    "dep:dotenvy",
]
