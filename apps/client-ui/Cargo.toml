[package]
name = "client-ui"
default-run = "client-ui"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
ui = { path = "../../crates/ui" }
domain = { path = "../../crates/domain" }
dioxus = { version = "0.7.10", features = ["router"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { version = "1.1.4", default-features = false, features = ["std", "serde", "parse"] }

[features]
default = ["web"]
web = ["dioxus/web"]

[dev-dependencies]
dioxus-ssr = "0.7.10"
