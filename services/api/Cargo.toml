[package]
name = "api"
default-run = "api"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
aws-sdk-s3.workspace = true
report-generator = { path = "../../crates/report-generator" }
reqwest.workspace = true
resend-rs = "0.35.0"
domain = { path = "../../crates/domain" }
serde.workspace = true
serde_json.workspace = true
config.workspace = true
dotenvy.workspace = true
tracing.workspace = true
sqlx.workspace = true
chrono.workspace = true
chrono-tz = "=0.10.4"
croner = "=4.0.1"
uuid.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["full"] }
axum = "0.8.9"
axum-extra = { version="0.10.3", features=["cookie"] }
tower-http = { version="0.6.11", features=["cors"] }
axum-auth = "0.8.1"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
argon2 = { version = "0.5.3", features = ["std"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
sha2 = "0.11.0"
base64 = "0.22.1"
hmac = "0.13.0"
hex = "0.4.3"
rand = "0.10.2"
deunicode = "1.6.2"
kakasi = "0.1.0"

image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
zip = { version = "9.0", default-features = false, features = ["deflate"] }
reqwest.workspace = true
http-body-util = "0.1"
temp-env = "0.3.6"

[[test]]
name = "e2e"
path = "e2e-test/main.rs"
# Select Docker-dependent tests explicitly with cargo api-e2e.
test = false
