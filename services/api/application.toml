[server]
host = "0.0.0.0"
port = 3000

[database]
max_connections = 1
min_connections = 1

[scheduler]
implementation = "vps"
poll_interval_secs = 10
retention_interval_secs = 3600
invocation_budget_secs = 240
retention_reserve_secs = 5
enabled = true
concurrency = 2
max_attempts = 5
retry_backoff_secs = 60
lease_secs = 300
max_payload_bytes = 20971520
max_email_bytes = 20971520

[browser]
public_origin = ""
insecure_local = true

[client.shopify]
admin_api_url = "https://enzumeii.myshopify.com/admin/api/2026-10/graphql.json"
timeout_secs = 3

[client.resend]
timeout_secs = 3

[client.paypal]
base_url = "https://api-m.paypal.com"
timeout_secs = 3

[client.vercel_blob]
api_url = "https://vercel.com/api/blob"
timeout_secs = 10

[client.stripe]
base_url = "https://api.stripe.com/v1/"
timeout_secs = 3
