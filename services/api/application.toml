[server]
host = "0.0.0.0"
port = 3000

[database]
max_connections = 2
min_connections = 1

[browser]
allowed_origins = ["https://convention.enzumeii.com", "https://enzumeii.vercel.app"]
insecure_local = false

[client.shopify]
admin_api_url = "https://enzumeii.myshopify.com/admin/api/2026-10/graphql.json"
timeout_secs = 10

[client.resend]
timeout_secs = 10

[client.paypal]
base_url = "https://api-m.paypal.com"
timeout_secs = 10

[client.stripe]
base_url = "https://api.stripe.com/v1/"
checkout_api_version = "2026-08-26.dahlia"
timeout_secs = 10

[client.s3]
endpoint = "https://jbcvsgdvhvzitweteqfo.storage.supabase.co/storage/v1/s3"
region = "ap-southeast-1"
bucket = "reports"
force_path_style = true
timeout_secs = 10
signed_url_ttl_secs = 300

[scheduler]
implementation = "vercel"
poll_interval_secs = 10
retention_interval_secs = 3600
invocation_budget_secs = 240
retention_reserve_secs = 5
enabled = true
concurrency = 2
max_attempts = 5
retry_backoff_secs = 60
lease_secs = 300
max_payload_bytes = 20971520
max_email_bytes = 20971520

[checkout_recovery]
enabled = true
wake_secs = 60
batch_size = 10
concurrency = 2
budget_secs = 60
lease_secs = 90
retry_backoff_secs = 60
max_retry_backoff_secs = 900
max_failures = 12

[checkout]
frontend_origin = "https://convention.enzumeii.com"
return_path_template = "/{convention_slug}/checkout/return?checkout_id={checkout_id}"
cancel_path_template = "/{convention_slug}/checkout/cancel?checkout_id={checkout_id}"
shopify_location_id = "65761018027"
reservation_secs = 3600
guest_recovery_secs = 604800
stripe_livemode = true
