[server]
host = "0.0.0.0"
port = 3000

[database]
max_connections = 1
min_connections = 1

[scheduler]
poll_interval_secs = 10
concurrency = 2
max_generation_attempts = 5
retry_backoff_secs = 60
lease_secs = 300
max_payload_bytes = 20971520
max_email_bytes = 20971520

[browser]
public_origin = ""
insecure_local = true

[client.shopify]
