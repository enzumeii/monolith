query DraftOrders(
  $first: Int!
  $after: String
  $query: String
  $sortKey: DraftOrderSortKeys
) {
  draftOrders(first: $first, after: $after, query: $query, sortKey: $sortKey) {
    nodes {
      id
      createdAt
      ready
      status
      tags
      customAttributes {
        key
        value
      }
      email
      reserveInventoryUntil
      lineItems(first: 100) {
        nodes {
          quantity
          variant {
            id
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
      order {
        id
      }
      totalPriceSet {
        presentmentMoney {
          amount
          currencyCode
        }
      }
      paymentTerms {
        id
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
