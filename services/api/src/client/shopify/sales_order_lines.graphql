query SalesOrderLines($id: ID!) {
  order(id: $id) {
    id
    lineItems(first: 250) {
      nodes {
        id
        title
        variantTitle
        sku
        quantity
        currentQuantity
        product {
          id
        }
        variant {
          id
        }
        originalUnitPriceSet {
          shopMoney {
            amount
            currencyCode
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
