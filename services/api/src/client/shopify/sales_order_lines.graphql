query SalesOrderLines(
  $id: ID!
  $includeLines: Boolean! = true
  $includeContact: Boolean! = false
) {
  order(id: $id) {
    id
    number @include(if: $includeContact)
    email @include(if: $includeContact)
    lineItems(first: 250) @include(if: $includeLines) {
      nodes {
        id
        title
        variantTitle
        sku
        quantity
        currentQuantity
        product {
          id
        }
        variant {
          id
        }
        originalUnitPriceSet {
          shopMoney {
            amount
            currencyCode
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
