query CheckoutOrder($id: ID!) {
  order(id: $id) {
    id
    name
    displayFinancialStatus
    cancelledAt
    tags
    customAttributes {
      key
      value
    }
    totalOutstandingSet {
      presentmentMoney {
        amount
        currencyCode
      }
    }
    transactions(first: 101) {
      id
      gateway
      kind
      status
      amountSet {
        presentmentMoney {
          amount
          currencyCode
        }
      }
    }
    totalPriceSet {
      presentmentMoney {
        amount
        currencyCode
      }
    }
  }
}
