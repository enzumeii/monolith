query ConventionVariant($id: ID!) {
  productVariant(id: $id) {
    id
    title
    sku
    image {
      url
      altText
    }
    product {
      id
      title
      featuredImage {
        url
        altText
      }
      status
    }
    inventoryPolicy
    inventoryItem {
      tracked
    }
  }
}
