query SoldVariantsInRange(
  $search: String!
  $ordersAfter: String
  $lineItemsAfter: String
) {
  orders(
    first: 1
    after: $ordersAfter
    query: $search
    sortKey: CREATED_AT
  ) {
    nodes {
      id
      name
      createdAt
      cancelledAt
      test
      displayFulfillmentStatus
      displayFinancialStatus
      lineItems(first: 100, after: $lineItemsAfter) {
        nodes {
          id
          title
          variantTitle
          sku
          quantity
          currentQuantity
          product {
            id
          }
          variant {
            id
          }
          originalUnitPriceSet {
            shopMoney {
              amount
              currencyCode
            }
            presentmentMoney {
              amount
              currencyCode
            }
          }
        }
        pageInfo { hasNextPage endCursor }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
