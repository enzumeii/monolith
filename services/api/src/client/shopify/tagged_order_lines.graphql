query TaggedOrderLines($first: Int!, $id: ID!, $after: String) {
  order(id: $id) {
    id
    lineItems(first: $first, after: $after) {
      nodes {
        title
        variantTitle
        sku
        quantity
        originalUnitPriceSet {
          shopMoney {
            amount
            currencyCode
          }
        }
        product {
          productType
        }
        variant {
          inventoryItem {
            unitCost {
              amount
              currencyCode
            }
            measurement {
              weight {
                value
                unit
              }
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
