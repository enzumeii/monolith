query OrdersByTag(
  $search: String!
  $after: String
) {
  orders(
    first: 250
    after: $after
    query: $search
    sortKey: CREATED_AT
    reverse: true
  ) {
    nodes {
      id
      number
      tags
      email
      phone
      currentTotalPriceSet {
        shopMoney { amount currencyCode }
      }
      lineItems(first: 250) {
        nodes {
          title
          variantTitle
          sku
          quantity
          originalUnitPriceSet {
            shopMoney { amount currencyCode }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
