mutation ActivateExistingInventory(
  $inventoryItemId: ID!
  $locationId: ID!
  $idempotencyKey: String!
  $onHand: Int!
  $available: Int!
) {
  inventoryActivate(
    inventoryItemId: $inventoryItemId
    locationId: $locationId
    onHand: $onHand
    available: $available
  ) @idempotent(key: $idempotencyKey) {
    inventoryLevel {
      id
      isActive
      quantities(names: ["available", "on_hand"]) {
        name
        quantity
      }
    }
    userErrors {
      field
      message
    }
  }
}
