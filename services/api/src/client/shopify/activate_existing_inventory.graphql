mutation ActivateExistingInventory(
  $inventoryItemId: ID!
  $locationId: ID!
  $idempotencyKey: String!
) {
  inventoryActivate(inventoryItemId: $inventoryItemId, locationId: $locationId)
    @idempotent(key: $idempotencyKey) {
    inventoryLevel {
      id
      isActive
      quantities(names: ["available", "on_hand"]) {
        name
        quantity
      }
    }
    userErrors {
      field
      message
    }
  }
}
