query ListOrders(
  $first: Int!
  $after: String
  $search: String!
  $includeContact: Boolean! = false
) {
  orders(
    first: $first
    after: $after
    query: $search
    sortKey: CREATED_AT
    reverse: true
  ) {
    nodes {
      id
      number
      email @include(if: $includeContact)
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
