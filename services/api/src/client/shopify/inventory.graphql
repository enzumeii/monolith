query FindInventoryToActivate(
  $locationId: ID!
  $after: String
) {
  location(id: $locationId) {
    id
    name
    inventoryLevels(
      first: 100
      after: $after
      includeInactive: true
    ) {
      nodes {
        id
        isActive
        quantities(names: ["on_hand", "available"]) {
          name
          quantity
        }
        item {
          id
          sku
          tracked
          variant {
            id
            title
            product {
              id
              title
            }
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
