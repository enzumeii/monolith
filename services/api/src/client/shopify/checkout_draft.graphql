query CheckoutDraft($id: ID!) {
  draftOrder(id: $id) {
    id
    ready
    status
    tags
    email
    reserveInventoryUntil
    lineItems(first: 100) {
      nodes {
        quantity
        variant {
          id
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    order {
      id
    }
    totalPriceSet {
      presentmentMoney {
        amount
        currencyCode
      }
    }
    paymentTerms {
      id
    }
  }
}
