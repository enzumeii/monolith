query SoldVariantsInRange(
  $first: Int!
  $search: String!
  $ordersAfter: String
) {
  orders(
    first: $first
    after: $ordersAfter
    query: $search
    sortKey: CREATED_AT
  ) {
    nodes {
      id
      name
      createdAt
      cancelledAt
      test
      displayFulfillmentStatus
      displayFinancialStatus
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
