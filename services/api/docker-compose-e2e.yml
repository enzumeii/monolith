services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 5s
      timeout: 3s
      retries: 10

  local-s3:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    restart: "no"
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${E2E_S3_ACCESS_KEY_ID:-synthetic-access-id}
      RUSTFS_SECRET_KEY: ${E2E_S3_SECRET_ACCESS_KEY:-synthetic-secret-key}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_REGION: ap-southeast-1
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:${E2E_S3_PORT:-5434}:9000"
    volumes:
      - local_s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  local-s3-init:
    image: amazon/aws-cli:2.34.14@sha256:0a8bbdb160cbb09e357ba24533204e90a97e2e56beadf1730739644c2d5f1bdb
    restart: "no"
    depends_on:
      local-s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${E2E_S3_ACCESS_KEY_ID:-synthetic-access-id}
      AWS_SECRET_ACCESS_KEY: ${E2E_S3_SECRET_ACCESS_KEY:-synthetic-secret-key}
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_MAX_ATTEMPTS: "1"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        bucket=$$(aws --endpoint-url http://local-s3:9000 s3api list-buckets --query 'Buckets[?Name==`reports`].Name | [0]' --output text)
        if [ "$$bucket" = "None" ]; then
          aws --endpoint-url http://local-s3:9000 s3api create-bucket --bucket reports --create-bucket-configuration LocationConstraint=ap-southeast-1
        fi
        aws --endpoint-url http://local-s3:9000 s3api head-bucket --bucket reports

volumes:
  local_s3_data:
